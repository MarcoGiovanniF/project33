<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>33</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="33">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3EF">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#F1F3EF; --ink-2:#FFFFFF; --ink-3:#DEE5DF;
    --brass:#2F6E62; --brass-dim:#62706A;
    --aurora:#3E8C7A; --haze:#5A6862; --cream:#1B2724;
    --ahead:#1F8A4C; --behind:#C0392B;
    --trend:#93A29A;
    --display:"Fraunces",Georgia,serif;
    --ui:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0 auto; max-width:520px; padding:0 18px 70px;
    background:var(--ink);
    background-image:radial-gradient(130% 55% at 50% -10%, #FFFFFF 0%, transparent 65%);
    background-attachment:fixed;
    color:var(--cream); font-family:var(--ui); font-size:16px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; font-size:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  .topband{ display:flex; align-items:center; gap:14px; padding:20px 0 14px; }
  .dial{ position:relative; flex:1 1 0; min-width:0; aspect-ratio:1; }
  .mini-chart{ flex:1 1 0; min-width:0; }
  .mini-chart svg{ width:100%; height:auto; display:block; }
  .dial svg{ width:100%; height:100%; display:block; }
  .track{ fill:none; stroke:var(--ink-3); stroke-width:11; }
  .arc{ fill:none; stroke:var(--ahead); stroke-width:11; stroke-linecap:round;
        transition:stroke-dashoffset .55s cubic-bezier(.22,1,.36,1), stroke .4s ease; }
  .tick{ fill:var(--ink-3); } .tick.top{ fill:var(--brass-dim); }
  .now-hand{ stroke:var(--haze); stroke-width:2; stroke-linecap:round; opacity:.85; }
  .dial-face{ position:absolute; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  .pace-time{ font-family:var(--display); font-variation-settings:"opsz" 120,"wght" 400;
              font-size:36px; line-height:1; letter-spacing:-.02em; font-feature-settings:"tnum";
              transition:color .4s ease; }
  .sec{ display:flex; align-items:baseline; justify-content:space-between; margin:24px 2px 10px;
        font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--haze); }
  .sec .count{ color:var(--brass-dim); }

  .habit{ display:flex; align-items:center; gap:14px; width:100%; min-height:62px;
          padding:12px 16px; margin-bottom:8px; background:var(--ink-2); border-radius:14px;
          overflow:hidden;
          box-shadow:0 0 0 1px var(--ink-3);
          text-align:left; transition:transform .16s ease, background .16s ease; }
  .habit:active{ transform:scale(.975); background:var(--ink-3); }
  .habit .body{ flex:1; min-width:0; }
  .habit .name{ font-size:17px; font-weight:500; }
  .habit .meta{ font-size:13px; color:var(--haze); margin-top:3px; font-feature-settings:"tnum"; }
  .mini{ height:4px; background:var(--ink-3); border-radius:99px; margin-top:8px; overflow:hidden; }
  .mini i{ display:block; height:100%; background:var(--brass); border-radius:99px; transition:width .3s ease; }
  .pts{ flex-shrink:0; align-self:stretch; width:62px; margin:-12px -16px -12px 0;
        display:flex; align-items:center; justify-content:center;
        font-size:20px; font-weight:700; font-feature-settings:"tnum"; letter-spacing:-.02em;
        border-radius:0 14px 14px 0; }
  .habit.flash{ background:var(--brass); color:#FFFFFF; box-shadow:none; }
  .habit.flash .meta, .habit.flash .pts{ color:rgba(255,255,255,.78); }
  #done{ margin-top:18px; }
  .habit.is-done .pts{ width:56px; font-size:18px; border-radius:0 14px 14px 0;
                       margin:-12px -16px -12px 0; }
  .habit.is-done{ background:transparent; box-shadow:0 0 0 1px var(--ink-3); min-height:52px; }
  .habit.is-done .name{ color:var(--haze); font-weight:400; }
  .undo{ flex-shrink:0; width:34px; height:34px; margin:-4px -4px -4px -4px; display:grid;
         place-items:center; color:var(--haze); font-size:18px; border-radius:9px; }
  .undo:active{ background:var(--ink-3); }

  .empty{ padding:28px 20px; text-align:center; color:var(--haze);
          border:1px dashed var(--ink-3); border-radius:16px; font-size:15px; }
  .empty b{ display:block; color:var(--cream); font-family:var(--display);
            font-variation-settings:"opsz" 40,"wght" 400; font-weight:400; font-size:20px; margin-bottom:6px; }

  .newday{ display:block; width:100%; margin-top:14px; padding:15px;
           border-radius:14px; background:var(--ink-2); box-shadow:0 0 0 1px var(--brass);
           color:var(--brass); font-size:15px; font-weight:500; text-align:center; }
  .newday.locked{ background:none; box-shadow:0 0 0 1px var(--ink-3); color:var(--haze); font-weight:400; }
  .newday.quiet{ background:none; box-shadow:0 0 0 1px var(--ink-3); color:var(--haze); font-weight:400; }
  .newday small{ display:block; font-size:12.5px; color:var(--haze); font-weight:400; margin-top:4px; }

  .footer{ display:flex; justify-content:center; gap:20px; margin-top:26px; }
  .footer button{ font-size:13px; color:var(--haze); padding:8px; }
  .hint{ text-align:center; font-size:12.5px; color:var(--brass-dim); margin-top:16px; }

  .scrim{ position:fixed; inset:0; background:rgba(27,39,36,.38);
          display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .scrim.open{ display:flex; }
  .sheet{ width:100%; max-width:520px; max-height:88vh; overflow:auto; background:var(--ink-2);
          border-radius:22px 22px 0 0; box-shadow:0 -2px 24px rgba(27,39,36,.14);
          padding:24px 20px calc(28px + env(safe-area-inset-bottom));
          animation:rise .26s cubic-bezier(.22,1,.36,1); }
  @keyframes rise{ from{ transform:translateY(20px); opacity:0 } to{ transform:none; opacity:1 } }
  .sheet h2{ font-family:var(--display); font-variation-settings:"opsz" 60,"wght" 400;
             font-weight:400; font-size:23px; margin:0 0 18px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
                color:var(--haze); margin-bottom:7px; }
  .field input, .field textarea{ width:100%; padding:13px 14px; font-size:16px; background:var(--ink);
    border:1px solid var(--ink-3); border-radius:11px; color:var(--cream); font-family:inherit; }
  .field .help{ font-size:12.5px; color:var(--haze); margin-top:7px; line-height:1.5; white-space:pre-line; }
  .two{ display:flex; gap:12px; } .two .field{ flex:1; }
  .primary{ display:block; width:100%; padding:16px; margin-top:6px; background:var(--brass);
            color:#FFFFFF; font-weight:600; font-size:16px; border-radius:13px; }
  .ghost{ display:block; width:100%; padding:14px; margin-top:10px; color:var(--haze); font-size:15px; }
  .danger{ color:#A8514C; }
  .grid-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:6px;
              border-radius:11px; box-shadow:0 0 0 1px var(--ink-3); }
  table.hist{ border-collapse:separate; border-spacing:0; font-size:13px; width:auto;
              font-variant-numeric:tabular-nums; }
  table.hist th, table.hist td{ padding:7px 10px; white-space:nowrap; text-align:right; }
  table.hist th.name, table.hist td.name{
    text-align:left; position:sticky; left:0; z-index:2;
    background:var(--ink-2); box-shadow:1px 0 0 var(--ink-3);
    max-width:130px; overflow:hidden; text-overflow:ellipsis; }
  table.hist thead th{ position:sticky; top:0; background:var(--ink-2); color:var(--haze);
                       font-weight:500; font-size:11.5px; box-shadow:0 1px 0 var(--ink-3); }
  table.hist thead th.name{ z-index:3; }
  table.hist tr.avg td, table.hist tr.avg th{ font-weight:700; box-shadow:0 1px 0 var(--ink-3); }
  table.hist tr.avg th.name{ color:var(--haze); }
  table.hist td.today{ color:var(--brass); }
  table.hist td.score{ font-weight:700; padding:7px 10px; }
  table.hist tr.avg td{ background:none; }
  table.hist tbody tr:nth-child(even) td:not(.name):not(.score){ background:rgba(0,0,0,.02); }
  .pad{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:0 0 18px; }
  .key{ padding:15px 0; font-size:19px; font-weight:500; background:var(--ink);
        border-radius:11px; box-shadow:0 0 0 1px var(--ink-3); }
  .key:active{ background:var(--brass); color:#FFFFFF; }
  .colbox{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; line-height:1.7; }
  .saving{ position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--haze);
    background:var(--ink-2); box-shadow:0 0 0 1px var(--ink-3);
    padding:6px 13px; border-radius:99px; opacity:0;
    transition:opacity .3s; pointer-events:none; z-index:30; }
  .saving.show{ opacity:1; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>

<div class="saving" id="saving"></div>

<div class="topband">
  <div class="dial">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <circle class="track" cx="100" cy="100" r="86"></circle>
    <circle class="arc" id="arc" cx="100" cy="100" r="86" transform="rotate(-90 100 100)"
            stroke-dasharray="540.35" stroke-dashoffset="540.35"></circle>
    <g id="ticks"></g>
    <line class="now-hand" id="nowHand" x1="100" y1="100" x2="100" y2="24"></line>
    <circle cx="100" cy="100" r="2.5" fill="var(--haze)"></circle>
  </svg>
  <div class="dial-face">
    <div class="pace-time" id="paceTime">00:00</div>
  </div>
  </div>
  <div class="mini-chart" id="miniChart"></div>
</div>

<div id="todo"></div>
<div id="done"></div>

<button class="newday" id="addBtn"></button>
<div class="hint" id="hint"></div>

<div class="footer">
  <button id="editBtn">Edit habits</button>
  <button id="chartBtn">Progress</button>
  <button id="histBtn">History</button>
  <button id="colBtn">Copy to sheet</button>
  <button id="dataBtn">Backup</button>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
  "use strict";
  var KEY = "p33:v5";
  var S = null, editMode = false, saveTimer = null;

  function dstr(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function addDays(s,n){ var d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return dstr(d); }
  function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

  /* ---------- live state carried over from the sheet ---------- */

  function seed(){
    var day = dstr(new Date());
    return {
      version: 3, lastDay: day, lastAdded: addDays(day, -1),
      history: [], log: {}, scores: {}, exported: addDays(day, -1),
      habits: []
    };
  }

  /* ---------- model: identical maths to the sheet ---------- */

  /* frac = how much of the habit got done today, 0 to 1. It maps onto the
     sheet's -1 .. 1 scale exactly as before, so nothing downstream changes. */
  function hval(h){ return clamp((h.frac || 0)*2 - 1, -1, 1); }
  function isDone(h){ return (h.frac || 0) >= 1; }
  function pctOf(h){ return Math.round((h.frac || 0) * 100); }

  /* Mean of every habit's score: the value your sheet keeps at the top of B. */
  /* The average for a past day, worked out from that day's score column.
     Nothing to store: the columns already contain it. Older days recorded
     before columns existed fall back to the average they saved at the time. */
  function avgForDay(d){
    var col = S.scores[d];
    if(col){
      if(!S.habits.length) return 0;
      /* Habits that did not exist yet count as 0, so the denominator is always
         today's habit count. Past averages therefore fall as the list grows,
         which keeps every day on the same scale. */
      var t = 0;
      S.habits.forEach(function(h){ t += (col[h.id] || 0); });
      return t / S.habits.length;
    }
    var e = S.history.filter(function(x){ return x.d === d; })[0];
    return (e && typeof e.avg === "number") ? e.avg : null;
  }

  function meanScore(){
    if(!S.habits.length) return 0;
    var t = 0; S.habits.forEach(function(h){ t += h.score; });
    return t / S.habits.length;
  }

  /* Share of today's habits completed, 0 to 1 — drives the pace dial. */
  function dayPct(){
    var n = S.habits.length; if(!n) return 0;
    var sum = 0; S.habits.forEach(function(h){ sum += hval(h); });
    return clamp((sum+n)/(2*n), 0, 1);
  }

  function rollover(){
    var today = dstr(new Date()), guard = 0;
    while(S.lastDay < today && guard++ < 500){
      var dayP = Math.round(dayPct()*1000)/1000;
      var dayN = S.habits.length;
      var doneCount = S.habits.filter(isDone).length;
      var rec = {};
      S.habits.forEach(function(h){
        rec[h.id] = hval(h);
        h.score = clamp(h.score + hval(h), 0, 100);
        h.frac = 0; h.expr = "";
      });
      S.log[S.lastDay] = rec;
      S.history.push({ d:S.lastDay, p:dayP, n:dayN, c:doneCount });
      /* the day's column, exactly as the sheet keeps it: every habit's score */
      var col = {};
      S.habits.forEach(function(h){ col[h.id] = h.score; });
      S.scores[S.lastDay] = col;
      S.lastDay = addDays(S.lastDay, 1);
    }
    if(S.history.length > 400) S.history = S.history.slice(-400);
    var days = Object.keys(S.log).sort();
    if(days.length > 400) days.slice(0, days.length-400).forEach(function(d){ delete S.log[d]; });
    var scd = Object.keys(S.scores).sort();
    if(scd.length > 400) scd.slice(0, scd.length-400).forEach(function(d){ delete S.scores[d]; });
  }

  /* A new habit is earned, not given. It unlocks only when yesterday was a
     clean sweep. Fall behind and the day's job is catching up instead. */
  function yesterdayRecord(){
    return S.log[addDays(S.lastDay, -1)] || null;
  }
  function gateState(){
    var rec = yesterdayRecord();
    if(!rec) return { open:true, reason:"first" };      // nothing to judge yet
    var ids = Object.keys(rec);
    if(!ids.length) return { open:true, reason:"first" };
    var missed = ids.filter(function(k){ return rec[k] < 1; });
    return missed.length
      ? { open:false, missed:missed.length, total:ids.length }
      : { open:true, reason:"earned" };
  }

  /* ---------- daily shuffle, stable within the day ---------- */

  /* A fresh order every day, fixed within the day so nothing moves under your
     thumb. Uses splitmix32: consecutive dates give seeds one apart, and a
     weaker generator turns those into near-identical shuffles — which had the
     same habit landing first day after day. This one avalanches properly. */
  function seededOrder(){
    var s = 0, k = S.lastDay;
    for(var i = 0; i < k.length; i++) s = (Math.imul(s, 31) + k.charCodeAt(i)) | 0;
    s = (s ^ 0x9E3779B9) | 0;

    function rnd(){
      s = (s + 0x9E3779B9) | 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 16), 0x21F0AAAD);
      t = Math.imul(t ^ (t >>> 15), 0x735A2D97);
      return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
    }

    var a = S.habits.slice();
    for(var j = a.length - 1; j > 0; j--){
      var m = Math.floor(rnd() * (j + 1));
      var tmp = a[j]; a[j] = a[m]; a[m] = tmp;
    }
    return a;
  }


  /* ---------- storage ---------- */

  function toast(msg){
    var el = document.getElementById("saving");
    el.textContent = msg; el.classList.add("show");
    setTimeout(function(){ el.classList.remove("show"); }, 3200);
  }

  /* Saves go to this device first — that works signed in or not, online or
     off, and from a home screen icon. The Claude account copy is attempted
     too so data can follow you between devices, but its failure is not an
     error worth interrupting you for. */

  var cloudOK = null;   // null = untried, then true / false

  function readLocal(){
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  }
  function writeLocal(v){
    try{ localStorage.setItem(KEY, v); return true; }catch(e){ return false; }
  }
  function readCloud(){
    try{
      if(!window.storage || !window.storage.get) return Promise.resolve(null);
      return window.storage.get(KEY).then(function(r){ return r && r.value; })
                                    .catch(function(){ return null; });
    }catch(e){ return Promise.resolve(null); }
  }
  function writeCloud(v){
    try{
      if(!window.storage || !window.storage.set) return Promise.reject();
      return window.storage.set(KEY, v);
    }catch(e){ return Promise.reject(); }
  }

  /* The device write happens immediately — waiting even a moment risks losing
     it if the tab is closed or the phone switches app. Only the slower account
     sync is debounced. */
  function save(){
    S.stamp = Date.now();
    var str = JSON.stringify(S);
    var local = writeLocal(str);
    if(!local) toast("can't save on this device — open Backup and copy it out");

    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      writeCloud(JSON.stringify(S)).then(function(){ cloudOK = true; })
                                   .catch(function(){ cloudOK = false; });
    }, 600);
  }

  /* Last chance to get it written before the page goes away. */
  function flushNow(){
    if(!S) return;
    clearTimeout(saveTimer);
    var str = JSON.stringify(S);
    writeLocal(str);
    writeCloud(str).then(function(){ cloudOK = true; }).catch(function(){ cloudOK = false; });
  }
  window.addEventListener("pagehide", flushNow);
  window.addEventListener("beforeunload", flushNow);

  function parse(v){
    try{ var o = JSON.parse(v); return (o && o.habits) ? o : null; }catch(e){ return null; }
  }

  /* How much history a copy holds. Used so a thin or stale copy can never
     silently wipe out a fuller one, whichever was written last. */
  function depth(x){
    if(!x) return -1;
    var days = x.log ? Object.keys(x.log).length : 0;
    var pts = (x.habits || []).reduce(function(a,h){ return a + (h.score || 0); }, 0);
    return days * 10000 + pts;
  }

  function pick(local, cloud){
    if(!local && !cloud) return seed();
    if(!local) return cloud;
    if(!cloud) return local;
    var dl = depth(local), dc = depth(cloud);
    /* a clearly fuller copy wins outright, regardless of timestamp */
    if(dl > dc) return local;
    if(dc > dl) return cloud;
    /* equally full — then the most recent write wins */
    return (cloud.stamp || 0) > (local.stamp || 0) ? cloud : local;
  }

  /* Repair for days recorded before score columns existed. While there was only
     one habit, its score is fully determined: the day's completion gives the
     value (+1 done, -1 missed, 0 half), and the score is the running total from
     zero. Derived, not guessed. Days with more than one habit are ambiguous and
     are left blank. */
  function backfillScores(){
    if(!S.habits.length || !S.history.length) return 0;
    var first = S.habits[0].id;        // habits are appended, so [0] is the oldest
    var running = 0, filled = 0;

    for(var i = 0; i < S.history.length; i++){
      var e = S.history[i];
      if(!e || !e.d) break;
      if(e.n !== 1) break;             // past this point the maths is ambiguous

      var val;
      if(typeof e.avg === "number") val = e.avg;                 // the score itself
      else if(typeof e.p === "number") val = clamp(running + (2*e.p - 1), 0, 100);
      else break;

      running = val;
      if(!S.scores[e.d]){
        var col = {}; col[first] = val;
        S.scores[e.d] = col;
        filled++;
      }
    }
    return filled;
  }

  function boot(){
    var local = parse(readLocal());
    readCloud().then(function(cv){
      var cloud = parse(cv);
      cloudOK = !!cv;
      S = pick(local, cloud);

      if(!S.history) S.history = [];
      if(!S.log) S.log = {};
      if(!S.scores) S.scores = {};
      if(!S.lastAdded) S.lastAdded = S.lastDay;
      if(!S.exported) S.exported = addDays(S.lastDay, -1);

      backfillScores();
      rollover(); render(); save();
      setInterval(tickDial, 30000);
    });
  }

  /* ---------- dial ---------- */

  var CIRC = 2*Math.PI*86;
  function buildTicks(){
    var out = "";
    for(var h=0; h<24; h+=3){
      var a = (h/24)*2*Math.PI - Math.PI/2;
      var r = (h%12===0) ? 3.2 : 1.8;
      out += '<circle class="tick'+(h===0?' top':'')+'" cx="'+(100+Math.cos(a)*70).toFixed(1)+
             '" cy="'+(100+Math.sin(a)*70).toFixed(1)+'" r="'+r+'"></circle>';
    }
    document.getElementById("ticks").innerHTML = out;
  }
  function fmt(mins){
    mins = clamp(Math.round(mins),0,24*60);
    if(mins >= 24*60) return "24:00";
    return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
  }
  function tickDial(){
    var pct = dayPct(), paceMins = pct*24*60;
    var now = new Date(), nowMins = now.getHours()*60 + now.getMinutes();
    var arc = document.getElementById("arc");
    arc.setAttribute("stroke-dashoffset", CIRC*(1-pct));

    /* green while the day's progress is level with or ahead of the clock,
       red once it falls behind. The whole dial carries it — no caption needed. */
    var ahead = !S.habits.length || paceMins >= nowMins;
    var col = ahead ? "var(--ahead)" : "var(--behind)";
    arc.style.stroke = col;
    var t = document.getElementById("paceTime");
    t.textContent = fmt(paceMins);
    t.style.color = col;
    var a = (nowMins/(24*60))*2*Math.PI - Math.PI/2;
    var hand = document.getElementById("nowHand");
    hand.setAttribute("x2",(100+Math.cos(a)*76).toFixed(1));
    hand.setAttribute("y2",(100+Math.sin(a)*76).toFixed(1));
  }
  /* Small overview chart beside the clock. Fixed 0-100 axis, so the line's
     height is literally how far along the journey you are. */
  /* One gradient reused by both charts. It runs bottom to top over the 0-100
     axis, so a point's colour is the rainbow value of its own number — the
     same mapping as the habit tiles. */
  function rainbowDefs(id, yTop, yBottom){
    var stops = "";
    for(var v = 0; v <= 100; v += 10){
      stops += '<stop offset="' + v + '%" stop-color="hsl(' + (v*3) + ',85%,45%)"></stop>';
    }
    return '<defs><linearGradient id="' + id + '" gradientUnits="userSpaceOnUse" ' +
           'x1="0" y1="' + yBottom + '" x2="0" y2="' + yTop + '">' + stops + "</linearGradient></defs>";
  }

  function drawMini(){
    var el = document.getElementById("miniChart");
    if(!el) return;
    var pts = chartPoints();
    var W = 168, H = 132, PAD = 11;

    if(pts.length < 2){ el.innerHTML = ""; return; }

    var last = pts[pts.length-1].total;
    var pr = projection(pts);
    var span = pr ? pr.span : (pts.length - 1);

    function x(i){ return PAD + (i/span) * (W - PAD*2); }
    function y(v){ return H - PAD - (clamp(v,0,100)/100) * (H - PAD*2); }

    var line = "";
    pts.forEach(function(p,i){ line += (i?"L":"M") + x(i).toFixed(1) + " " + y(p.total).toFixed(1) + " "; });

    var climb = pr
      ? '<line x1="' + x(pts.length-1).toFixed(1) + '" y1="' + y(last).toFixed(1) +
        '" x2="' + x(pr.span).toFixed(1) + '" y2="' + y(100).toFixed(1) +
        '" stroke="var(--trend)" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"></line>'
      : "";

    /* today's own rate, carried on at the same slope */
    var tod = todayRate(pts), rate = "";
    if(tod){
      var tx = Math.min(tod.span, span);
      var ty = 100 - (tod.span - tx) * tod.delta;
      rate = '<line x1="' + x(pts.length-1).toFixed(1) + '" y1="' + y(last).toFixed(1) +
             '" x2="' + x(tx).toFixed(1) + '" y2="' + y(ty).toFixed(1) +
             '" stroke="var(--ahead)" stroke-width="1.3" stroke-dasharray="1 3" ' +
             'stroke-linecap="round" opacity=".85"></line>';
    }

    var summitLabel = pr
      ? '<text x="' + (W-PAD) + '" y="' + (y(100)-3).toFixed(1) + '" text-anchor="end" ' +
        'font-size="8.5" fill="var(--haze)" font-family="' + "Inter Tight, sans-serif" + '">' +
        esc(shortProjDate(pr.daysLeft)) + "</text>"
      : "";

    el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '">' +
      rainbowDefs("gradMini", y(100), y(0)) + climb + rate + summitLabel +
      '<path d="' + line + '" fill="none" stroke="url(#gradMini)" stroke-width="2.2" ' +
        'stroke-linejoin="round" stroke-linecap="round"></path>' +
      "</svg>";
  }

  /* ---------- render ---------- */

  function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  /* Score colouring: hue = score * 3, so 0 is red and 100 is purple,
     the full way round the rainbow. */
  /* Where a habit's score lands if the day ended now. Scores only bank at
     midnight, but showing yesterday's number next to a habit you have just
     done reads as broken — and disagrees with the average above. */
  /* Where the score stands if the day ended right now. A habit you have not
     got to yet is heading for -1, so it shows one lower from the start of the
     day and climbs back as you log — the same basis as the pace dial. */
  function liveScore(h){ return clamp(h.score + hval(h), 0, 100); }
  function liveMean(){
    if(!S.habits.length) return 0;
    var t = 0; S.habits.forEach(function(h){ t += liveScore(h); });
    return t / S.habits.length;
  }

  function scoreHue(v){ return clamp(v * 3, 0, 300); }

  /* Vivid tile, dark number of the same hue. Saturation and lightness are the
     same at every hue so the ramp reads as one even rainbow. */
  function scoreTile(v){
    var h = scoreHue(v).toFixed(0);
    return "background:hsl(" + h + ",90%,55%);color:hsl(" + h + ",95%,17%)";
  }

  /* plain coloured text, used for the averages */
  function scoreStyle(v){ return "color:hsl(" + scoreHue(v).toFixed(0) + ",85%,25%)"; }

  /* Below 10 an average of 0.08 must not render as "0" — it looks broken. */
  /* Scores and averages display as whole numbers. The underlying values keep
     their decimals — only the display rounds. */
  function fineNum(v){ return String(Math.round(v)); }

  function num(v){ return (Math.round(v*10)/10).toString().replace(/\.0$/,""); }
  /* exports keep more decimals — 5/12 of a habit must not round to nothing */
  function fmtVal(v){ return parseFloat(v.toFixed(4)).toString(); }

  function render(){
    tickDial(); drawMini();

    var order = seededOrder();
    var todo = order.filter(function(h){ return !isDone(h); });
    var done = order.filter(isDone);
    var t = document.getElementById("todo");

    if(!S.habits.length){
      t.innerHTML = '<div class="empty"><b>Nothing here yet</b>Add one habit to begin.</div>';
    } else if(!todo.length){
      t.innerHTML = '<div class="empty"><b>All clear</b>Every habit, done. Rest is earned.</div>';
    } else {
      var html = "";
      todo.forEach(function(h){
        var meta = "";
        if(h.frac > 0){
          meta = '<div class="mini"><i style="width:'+pctOf(h)+'%"></i></div>';
        }
        html += '<button class="habit" data-id="'+h.id+'">'+
                  '<div class="body"><div class="name">'+esc(h.name)+"</div>"+meta+"</div>"+
                  '<div class="pts" style="'+scoreTile(liveScore(h))+'">'+fineNum(liveScore(h))+"</div></button>";
      });
      t.innerHTML = html;
    }

    var dEl = document.getElementById("done");
    if(done.length){
      var dh = "";
      done.forEach(function(h){
        dh += '<div class="habit is-done">'+
              '<button class="undo" data-undo="'+h.id+'" aria-label="Undo '+esc(h.name)+'">↺</button>'+
              '<div class="body"><div class="name">'+esc(h.name)+"</div></div>"+
              '<div class="pts" style="'+scoreTile(liveScore(h))+'">'+fineNum(liveScore(h))+"</div></div>";
      });
      dEl.innerHTML = dh;
    } else dEl.innerHTML = "";

    var add = document.getElementById("addBtn");
    var already = S.lastAdded === S.lastDay;
    var gate = gateState();

    if(already){
      add.className = "newday quiet";
      add.innerHTML = "Today's habit is added<small>Next one tomorrow, if today lands clean</small>";
    } else if(!gate.open){
      add.className = "newday locked";
      add.innerHTML = "No new habit today<small>" + gate.missed + " of " + gate.total +
        " missed yesterday — today is for getting back up to speed</small>";
    } else {
      add.className = "newday";
      add.innerHTML = "+ Add today's new habit<small>" +
        (gate.reason === "earned" ? "Earned it — yesterday was clean" : "One a day, one at a time") +
        "</small>";
    }

    document.getElementById("hint").textContent =
      S.habits.length ? "Tap to enter an amount · hold to tick off" : "";
    document.getElementById("editBtn").textContent = editMode ? "Done editing" : "Edit habits";
  }

  /* ---------- interaction ---------- */

  function byId(id){ return S.habits.filter(function(h){ return h.id===id; })[0]; }
  var holdTimer = null, held = false;
  var todoEl = document.getElementById("todo");

  todoEl.addEventListener("pointerdown", function(e){
    var el = e.target.closest(".habit"); if(!el) return;
    held = false;
    holdTimer = setTimeout(function(){
      held = true;
      var h = byId(el.dataset.id); if(!h) return;
      if(editMode){ openEdit(h); return; }
      h.frac = 1; h.expr = ""; save();
      el.classList.add("flash"); setTimeout(render,200);
    }, 480);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){
    todoEl.addEventListener(ev, function(){ clearTimeout(holdTimer); });
  });
  todoEl.addEventListener("click", function(e){
    var el = e.target.closest(".habit"); if(!el || held) return;
    var h = byId(el.dataset.id); if(!h) return;
    if(editMode){ openEdit(h); return; }
    openEntry(h);
  });
  document.getElementById("done").addEventListener("click", function(e){
    var b = e.target.closest("[data-undo]"); if(!b) return;
    var h = byId(b.dataset.undo); if(!h) return;
    h.frac = 0; h.expr = ""; save(); render();
  });
  document.getElementById("editBtn").onclick = function(){
    editMode = !editMode; render();
    if(editMode) document.getElementById("hint").textContent = "Tap any habit above to edit it";
  };

  /* ---------- sheets ---------- */

  var scrim = document.getElementById("scrim"), sheetEl = document.getElementById("sheet");
  function open(html){ sheetEl.innerHTML = html; scrim.classList.add("open"); }
  function close(){ scrim.classList.remove("open"); sheetEl.innerHTML = ""; }
  scrim.onclick = function(e){ if(e.target === scrim) close(); };

  /* ---------- arithmetic, parsed by hand ----------
     Handles digits, . + - * / and brackets. No eval anywhere: eval is unsafe
     and is often blocked outright by page security policy. Returns a number,
     or null if the expression is incomplete or nonsense. */

  function evalExpr(src){
    var t = String(src).replace(/\s+/g,"").replace(/[×✕]/g,"*").replace(/[÷]/g,"/").replace(/[−–—]/g,"-");
    if(!t) return null;
    var i = 0;

    function peek(){ return t.charAt(i); }
    function expr(){
      var v = term();
      if(v === null) return null;
      while(peek() === "+" || peek() === "-"){
        var op = t.charAt(i++), r = term();
        if(r === null) return null;
        v = (op === "+") ? v + r : v - r;
      }
      return v;
    }
    function term(){
      var v = factor();
      if(v === null) return null;
      while(peek() === "*" || peek() === "/"){
        var op = t.charAt(i++), r = factor();
        if(r === null) return null;
        if(op === "/"){ if(r === 0) return null; v = v / r; }
        else v = v * r;
      }
      return v;
    }
    function factor(){
      if(peek() === "-"){ i++; var n = factor(); return n === null ? null : -n; }
      if(peek() === "+"){ i++; return factor(); }
      if(peek() === "("){
        i++;
        var v = expr();
        if(v === null || peek() !== ")") return null;
        i++;
        return v;
      }
      var start = i;
      while(/[0-9.]/.test(peek())) i++;
      if(i === start) return null;
      var num = parseFloat(t.slice(start, i));
      return isFinite(num) ? num : null;
    }

    var out = expr();
    if(out === null || i !== t.length || !isFinite(out)) return null;
    return out;
  }

  /* ---------- entering how much got done ---------- */

  var PADKEYS = ["7","8","9","(",")","4","5","6","/","⌫","1","2","3","*","+","0",".","-"];

  function openEntry(h){
    var text = h.expr || (h.frac ? String(h.frac) : "");

    function draw(){
      var v = evalExpr(text);
      var pct = v === null ? null : Math.round(clamp(v,0,1)*100);
      var read = !text ? "nothing entered yet"
               : v === null ? "not a finished sum"
               : v > 1 ? "over 100% — counts as done"
               : v < 0 ? "below zero — counts as missed"
               : pct + "% of the way there";

      open("<h2>" + esc(h.name) + "</h2>" +
        '<div class="field"><label>How much did you do?</label>' +
          '<input id="e-in" class="colbox" value="' + esc(text) + '" placeholder="e.g. 1/2" ' +
            'inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false">' +
          '<div class="help" id="e-read">' + esc(read) + "</div></div>" +
          '<div class="mini" style="margin:-6px 0 16px"><i style="width:' +
            (pct === null ? 0 : pct) + '%"></i></div>' +
        '<div class="pad">' +
          PADKEYS.map(function(k){ return '<button class="key" data-k="' + k + '">' + k + "</button>"; }).join("") +
        "</div>" +
        '<button class="primary" id="e-save">Save' + (pct === null ? "" : " " + pct + "%") + "</button>" +
        '<button class="ghost" id="e-full">Mark fully done instead</button>' +
        '<button class="ghost" id="e-clear">Clear back to nothing</button>' +
        '<button class="ghost" id="e-cancel">Cancel</button>');

      var input = document.getElementById("e-in");
      input.oninput = function(){ text = input.value; redraw(true); };

      sheetEl.querySelectorAll(".key").forEach(function(b){
        b.onclick = function(){
          text = (b.dataset.k === "⌫") ? text.slice(0,-1) : text + b.dataset.k;
          redraw(false);
        };
      });

      document.getElementById("e-cancel").onclick = close;
      document.getElementById("e-clear").onclick = function(){ text = ""; redraw(false); };
      document.getElementById("e-full").onclick = function(){
        h.frac = 1; h.expr = ""; save(); close(); render();
      };
      document.getElementById("e-save").onclick = function(){
        var val = evalExpr(text);
        if(val === null){ document.getElementById("e-read").textContent = "That sum isn't finished — check the brackets."; return; }
        h.frac = clamp(val, 0, 1);
        h.expr = (h.frac > 0 && h.frac < 1) ? text : "";
        save(); close(); render();
      };
    }

    /* redraw without stealing the caret while they're typing */
    function redraw(typing){
      if(typing){
        var v = evalExpr(text);
        var pct = v === null ? null : Math.round(clamp(v,0,1)*100);
        document.getElementById("e-read").textContent =
          !text ? "nothing entered yet"
          : v === null ? "not a finished sum"
          : v > 1 ? "over 100% — counts as done"
          : v < 0 ? "below zero — counts as missed"
          : pct + "% of the way there";
        sheetEl.querySelector(".mini i").style.width = (pct === null ? 0 : pct) + "%";
        document.getElementById("e-save").textContent = "Save" + (pct === null ? "" : " " + pct + "%");
      } else draw();
    }

    draw();
  }

  function form(h){
    var isNew = !h;
    h = h || { name:"", score:0 };
    return '<h2>'+(isNew?"New habit":"Edit habit")+"</h2>"+
      '<div class="field"><label>Name</label><input id="f-name" value="'+esc(h.name)+
        '" placeholder="e.g. drink water" autocapitalize="none"></div>'+
      '<div class="field"><label>Score so far</label><input id="f-score" type="number" '+
        'inputmode="numeric" step="any" min="0" value="'+h.score+'">'+
        '<div class="help">New habits start at 0. Hold a habit to tick it off, or tap it to enter '+
        'part of one, like 1/2 or 5/12.</div></div>'+
      '<button class="primary" id="f-save">'+(isNew?"Add habit":"Save changes")+"</button>"+
      (isNew?"":'<button class="ghost danger" id="f-del">Delete this habit</button>')+
      '<button class="ghost" id="f-cancel">Cancel</button>';
  }

  function wire(h){
    document.getElementById("f-cancel").onclick = close;
    document.getElementById("f-save").onclick = function(){
      var name = document.getElementById("f-name").value.trim();
      if(!name){ document.getElementById("f-name").focus(); return; }
      var score  = Math.max(0, parseFloat(document.getElementById("f-score").value) || 0);
      if(h){
        h.name = name; h.score = score;
      } else {
        S.habits.push({ id:Math.random().toString(36).slice(2,9), name:name,
                        score:score, frac:0, expr:"" });
        S.lastAdded = S.lastDay;
      }
      save(); close(); render();
    };
    var del = document.getElementById("f-del");
    if(del) del.onclick = function(){
      open('<h2>Delete "'+esc(h.name)+'"?</h2><div class="field"><div class="help">'+
        "Its points go with it. This can't be undone.</div></div>"+
        '<button class="primary" id="d-yes">Delete it</button>'+
        '<button class="ghost" id="d-no">Keep it</button>');
      document.getElementById("d-no").onclick = close;
      document.getElementById("d-yes").onclick = function(){
        S.habits = S.habits.filter(function(x){ return x.id !== h.id; });
        save(); close(); render();
      };
    };
  }
  function openEdit(h){ open(form(h)); wire(h); }
  document.getElementById("addBtn").onclick = function(){
    var gate = gateState();
    if(S.lastAdded === S.lastDay){
      open('<h2>Already added today</h2><div class="field"><div class="help">' +
        "You've added a habit today. The next one unlocks tomorrow, as long as everything " +
        "on today's list gets done.</div></div>" +
        '<button class="ghost" id="g-close">Close</button>');
      document.getElementById("g-close").onclick = close; return;
    }
    if(!gate.open){
      open('<h2>Not today</h2><div class="field"><div class="help">' +
        "You missed " + gate.missed + " of " + gate.total + " yesterday, so there's no new habit " +
        "today. Today's job is the list you already have.\n\nClear it, and tomorrow you get " +
        "another one.</div></div>" +
        '<button class="ghost" id="g-close">Fair enough</button>');
      document.getElementById("g-close").onclick = close; return;
    }
    open(form(null)); wire(null);
  };

  /* ---------- progress over time ---------- */

  /* Every recorded day, oldest first, plus today as it currently stands. */
  /* ---------- progress ----------
     The running total of the daily score, accumulated exactly as the sheet
     does it: +1 for a habit done, -1 for one missed, partials in between.
     It falls when habits slip, because that is what is happening. The trend
     line is the answer to "never mind this week, which way is it going?" */

  function chartPoints(){
    var out = [];
    S.history.forEach(function(e){
      var a = avgForDay(e.d);
      if(a !== null) out.push({ d:e.d, total:a, sum:(e.p||0)*2-1, n:e.n||0 });
    });
    /* today, as it stands right now */
    out.push({ d:S.lastDay, total:liveMean(), sum:dayPct()*2-1, n:S.habits.length });
    return out;
  }

  function trendOf(pts){
    var n = pts.length;
    if(n < 3) return null;
    var sx=0, sy=0, sxy=0, sxx=0;
    pts.forEach(function(p,i){ sx+=i; sy+=p.total; sxy+=i*p.total; sxx+=i*i; });
    var den = n*sxx - sx*sx;
    if(!den) return null;
    var slope = (n*sxy - sx*sy)/den;
    var intercept = (sy - slope*sx)/n;
    return { slope:slope, at:function(i){ return intercept + slope*i; } };
  }

  function cleanStreak(){
    var run = 0;
    for(var i = S.history.length - 1; i >= 0; i--){
      if((S.history[i].p || 0) >= 1) run++; else break;
    }
    return run;
  }

  /* How far the x axis has to run for the trend to reach 100. Returns null when
     the trend is flat or falling (no summit in sight) or when it is so shallow
     the answer is decades away and meaningless. */
  function projection(pts){
    var tr = trendOf(pts);
    if(!tr || tr.slope <= 0.0008) return null;
    var last = pts.length - 1;
    var at100 = (100 - tr.at(0)) / tr.slope;
    if(at100 <= last) at100 = last + 1;          // already at the top
    if(at100 > last + 3650) return null;          // beyond ten years
    return { tr: tr, span: at100, daysLeft: Math.round(at100 - last) };
  }

  function shortProjDate(daysLeft){
    var d = new Date();
    d.setDate(d.getDate() + daysLeft);
    return MON[d.getMonth()] + " " + String(d.getFullYear()).slice(2);
  }

  function projectedDate(daysLeft){
    var d = new Date();
    d.setDate(d.getDate() + daysLeft);
    return (d.getDate()) + " " + MON[d.getMonth()] + " " + d.getFullYear();
  }

  /* The segment from yesterday to today, carried forward. Steeper than the
     trend means today is beating your average; shallower means it is not. */
  function todayRate(pts){
    if(pts.length < 2) return null;
    var last = pts[pts.length-1].total, prev = pts[pts.length-2].total;
    var delta = last - prev;
    if(delta <= 0.0005) return null;
    return { delta: delta, span: (pts.length-1) + (100 - last)/delta };
  }

  function chartSVG(pts){
    var W = 320, H = 142, PAD = 14;
    if(pts.length < 3){
      return '<div class="help">Not enough days yet — the chart fills in as you go.</div>';
    }
    /* fixed 0-100: the same scale as the goal, so height means distance travelled */
    var lo = 0, hi = 100;
    var tr = trendOf(pts);

    var pr = projection(pts);
    var span = pr ? pr.span : (pts.length - 1);
    function x(i){ return PAD + (i/span) * (W - PAD*2); }
    function y(v){ return H - PAD - (clamp(v,lo,hi)/(hi - lo)) * (H - PAD*2); }

    var line = "";
    pts.forEach(function(p,i){ line += (i?"L":"M") + x(i).toFixed(1) + " " + y(p.total).toFixed(1) + " "; });
    var base = y(Math.max(lo, 0)).toFixed(1);
    var area = line + "L" + x(pts.length-1).toFixed(1) + " " + base +
               " L" + x(0).toFixed(1) + " " + base + " Z";

    var dots = "";   /* value is carried by the line's colour now */

    var summit = '<line x1="' + PAD + '" y1="' + y(100).toFixed(1) + '" x2="' + (W-PAD) +
      '" y2="' + y(100).toFixed(1) + '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"></line>';

    var zero = (lo < 0 && hi > 0)
      ? '<line x1="' + PAD + '" y1="' + y(0).toFixed(1) + '" x2="' + (W-PAD) +
        '" y2="' + y(0).toFixed(1) + '" stroke="var(--ink-3)" stroke-width="1"></line>' : "";

    /* the trend, carried on to where it meets 100 */
    var trend = "";
    if(pr){
      trend = '<line x1="' + x(0).toFixed(1) + '" y1="' + y(tr.at(0)).toFixed(1) +
        '" x2="' + x(pr.span).toFixed(1) + '" y2="' + y(100).toFixed(1) +
        '" stroke="var(--trend)" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="round"></line>' +
        '<circle cx="' + x(pr.span).toFixed(1) + '" cy="' + y(100).toFixed(1) +
        '" r="3" fill="none" stroke="var(--trend)" stroke-width="1.3"></circle>' +
        '<text x="' + (W-PAD) + '" y="' + (y(100)-6).toFixed(1) + '" text-anchor="end" font-size="10" ' +
        'fill="var(--haze)">100 · ' + esc(projectedDate(pr.daysLeft)) + '</text>';
    } else if(tr){
      trend = '<line x1="' + x(0).toFixed(1) + '" y1="' + y(tr.at(0)).toFixed(1) +
        '" x2="' + x(pts.length-1).toFixed(1) + '" y2="' + y(tr.at(pts.length-1)).toFixed(1) +
        '" stroke="var(--trend)" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="round"></line>';
    }

    var tod = todayRate(pts), rate = "";
    if(tod){
      var tx = Math.min(tod.span, span);
      var ty = 100 - (tod.span - tx) * tod.delta;
      rate = '<line x1="' + x(pts.length-1).toFixed(1) + '" y1="' + y(pts[pts.length-1].total).toFixed(1) +
             '" x2="' + x(tx).toFixed(1) + '" y2="' + y(ty).toFixed(1) +
             '" stroke="var(--ahead)" stroke-width="1.5" stroke-dasharray="1 3" ' +
             'stroke-linecap="round" opacity=".85"></line>';
    }

    var last = pts[pts.length-1];
    return '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block">' +
      rainbowDefs("gradBig", y(100), y(0)) + summit + zero +
      '<path d="' + area + '" fill="url(#gradBig)" opacity=".10"></path>' + trend + rate +
      '<path d="' + line + '" fill="none" stroke="url(#gradBig)" stroke-width="2.4" ' +
        'stroke-linejoin="round" stroke-linecap="round"></path>' + dots + "</svg>";
  }

  function openProgress(){
    var pts = chartPoints();
    var tr = trendOf(pts);
    var pr = projection(pts);
    var total = pts.length ? pts[pts.length-1].total : 0;
    var round1 = function(v){ return Math.round(v*10)/10; };
    var round2 = function(v){ return Math.round(v*100)/100; };
    var clean = S.history.filter(function(e){ return (e.p||0) >= 1; }).length;
    var rough = pts.filter(function(p){ return p.sum < 0; }).length;
    var run = cleanStreak();
    var best = 0, bestDay = "";
    S.history.forEach(function(e){ if((e.p||0) > best){ best = e.p; bestDay = e.d; } });

    var offTrend = "Not enough days to place you on it yet";
    if(tr){
      var gap = pts[pts.length-1].total - tr.at(pts.length-1);
      offTrend = Math.abs(gap) < 0.05 ? "You are sitting right on the trend line"
               : gap > 0 ? "You are " + round2(gap) + " above your trend line"
               : "You are " + round2(-gap) + " below your trend line — the line is where you get back to";
    }

    var dir = !tr ? "not enough days to call it yet"
            : tr.slope >  0.02 ? "rising, about " + (Math.round(tr.slope*100)/100) + " a day"
            : tr.slope < -0.02 ? "falling, about " + (Math.round(Math.abs(tr.slope)*100)/100) + " a day"
            : "flat — holding steady";

    open("<h2>Progress</h2>" +
      '<div class="field"><label>Average habit score</label>' + chartSVG(pts) +
        '<div class="help">The same number your sheet keeps at the top of column B: every ' +
        "habit's score, averaged. It falls on the days habits slip, and a brand new habit " +
        "pulls it down slightly, exactly as it does in the sheet. Hollow rings are the days " +
        "that lost ground. The dashed line is the trend — while that points up, a bad week " +
        "is a dip and not a reversal.</div></div>" +

      '<div class="field"><label>Which way it is going</label><div class="help">' +
        "Trend: " + dir + "\n" +
        (pr ? "At this rate, 100 around " + projectedDate(pr.daysLeft) +
              " — " + pr.daysLeft + " days away\n"
            : "Not climbing toward 100 at the moment\n") +
        offTrend + "\n" +
        (run > 0 ? "Clean days in a row: " + run + "\n" : "") +
        "Days tracked: " + S.history.length +
          " · everything done on " + clean + " · lost ground on " + rough +
      "</div></div>" +

      '<div class="field"><label>Where you are</label><div class="help">' +
        "Average habit score: " + Math.round(total) + "\n" +
        "Across " + S.habits.length + " habit" + (S.habits.length===1?"":"s") + "\n" +
        (S.habits.length
          ? "Adding one more would dip the average by " + round2(total/(S.habits.length+1)) +
            " — a notch in the line, not a setback\n"
          : "") +
        "100 is the horizon, not the yardstick." +
      "</div></div>" +
      '<button class="ghost" id="pr-close">Close</button>');
    document.getElementById("pr-close").onclick = close;
  }

  document.getElementById("chartBtn").onclick = openProgress;

  /* ---------- history, laid out like the sheet ---------- */

  /* Unlike the habit list, this one is unseeded — a new order on every open. */
  function shuffled(list){
    var a = list.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }


  function openHistory(){
    /* Days that have a full score column, plus any day the history knows about
       but predates score-columns being recorded — those still show an average. */
    var seen = {};
    Object.keys(S.scores).forEach(function(d){ seen[d] = true; });
    S.history.forEach(function(e){ if(e && e.d) seen[e.d] = true; });
    var days = Object.keys(seen).sort().slice(-60);
    var showToday = true;

    if(!days.length && !S.habits.length){
      open("<h2>History</h2><div class=\"field\"><div class=\"help\">Nothing recorded yet. " +
        "The first column appears after tonight.</div></div>" +
        '<button class="ghost" id="h-close">Close</button>');
      document.getElementById("h-close").onclick = close;
      return;
    }

    var cols = days.concat(showToday ? [S.lastDay] : []);

    function scoreOn(h, d){
      if(d === S.lastDay) return liveScore(h);   // today, as it stands right now
      var col = S.scores[d];
      if(!col) return null;                      // no column at all for that day
      return col[h.id] !== undefined ? col[h.id] : 0;   // habit did not exist yet
    }
    function avgOn(d){
      return d === S.lastDay ? liveMean() : avgForDay(d);
    }

    var missing = days.filter(function(d){ return !S.scores[d]; }).length;

    var head = '<thead><tr><th class="name">Habit</th>' +
      cols.map(function(d){
        var mark = (d !== S.lastDay && !S.scores[d]) ? " ·" : "";
        return "<th>" + esc(d === S.lastDay ? "today" : shortDate(d) + mark) + "</th>";
      }).join("") + "</tr></thead>";

    var avgRow = '<tr class="avg"><th class="name">Average</th>' +
      cols.map(function(d){
        var a = avgOn(d);
        if(a === null) return "<td></td>";
        return '<td class="score ' + (d===S.lastDay?"today":"") + '" style="' +
               scoreStyle(a) + '">' + fineNum(a) + "</td>";
      }).join("") + "</tr>";

    var rowOrder = shuffled(S.habits);

    var body = rowOrder.map(function(h){
      return '<tr><td class="name">' + esc(h.name) + "</td>" +
        cols.map(function(d){
          var v = scoreOn(h, d);
          if(v === null) return "<td></td>";
          return '<td class="score ' + (d===S.lastDay?"today":"") + '" style="' +
                 scoreTile(v) + '">' + fineNum(v) + "</td>";
        }).join("") + "</tr>";
    }).join("");

    open("<h2>History</h2>" +
      (missing ? '<div class="help" style="margin-bottom:10px">Columns marked with a dot ' +
        "have an average but no per-habit scores — those days were recorded before the " +
        "history grid existed.</div>" : "") +
      '<div class="grid-wrap"><table class="hist">' + head +
        "<tbody>" + avgRow + body + "</tbody></table></div>" +
      '<div class="help" style="margin-bottom:16px">Each column is one day\'s scores with the ' +
        "average on top, the same shape as your sheet. Scroll sideways for older days.\n\n" +
        "The last column is where today lands if it ended now — every habit starts one " +
        "lower and climbs back as you log it.</div>" +
      '<button class="primary" id="h-copy">Copy the whole grid</button>' +
      '<button class="ghost" id="h-close">Close</button>');

    document.getElementById("h-close").onclick = close;
    document.getElementById("h-copy").onclick = function(){
      var lines = [["Habit"].concat(cols.map(function(d){ return d===S.lastDay ? S.lastDay : d; })).join("\t")];
      lines.push(["Average"].concat(cols.map(function(d){
        var a = avgOn(d); return a === null ? "" : fmtVal(a);
      })).join("\t"));
      rowOrder.forEach(function(h){
        lines.push([h.name].concat(cols.map(function(d){
          var v = scoreOn(h, d); return v === null ? "" : fmtVal(v);
        })).join("\t"));
      });
      var txt = lines.join("\n");
      navigator.clipboard.writeText(txt).then(function(){
        document.getElementById("h-copy").textContent = "Copied — paste into a blank sheet";
      }).catch(function(){
        document.getElementById("h-copy").textContent = "Couldn't copy on this device";
      });
    };
  }

  function shortDate(d){
    var p = d.split("-");
    return (+p[2]) + " " + MON[+p[1]-1];
  }

  document.getElementById("histBtn").onclick = openHistory;

  /* ---------- today's column, for pasting into the sheet ---------- */

  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function prettyDate(d){
    var p = d.split("-");
    return (+p[2]) + " " + MON[+p[1]-1] + " " + p[0];
  }

  /* days recorded but not yet copied into the sheet, oldest first */
  function pendingDays(){
    return Object.keys(S.log).filter(function(d){ return d > S.exported; }).sort();
  }

  /* one tab-separated block: date row on top, one line per habit beneath */
  function buildBlock(days, withToday){
    var cols = days.slice();
    if(withToday) cols.push(S.lastDay);
    var lines = [cols.map(prettyDate).join("\t")];
    S.habits.forEach(function(h){
      lines.push(cols.map(function(d){
        if(d === S.lastDay && withToday) return fmtVal(hval(h));
        var rec = S.log[d];
        return (rec && rec[h.id] !== undefined) ? fmtVal(rec[h.id]) : "";
      }).join("\t"));
    });
    return lines.join("\n");
  }

  document.getElementById("colBtn").onclick = function(){
    var days = pendingDays();
    var withToday = false;

    function panel(){
      var cols = days.length + (withToday ? 1 : 0);
      var span = cols
        ? (cols === 1
            ? prettyDate(withToday && !days.length ? S.lastDay : days[0])
            : prettyDate(days.length ? days[0] : S.lastDay) + " → " +
              prettyDate(withToday ? S.lastDay : days[days.length-1]))
        : "nothing waiting";

      open("<h2>Copy into the sheet</h2>" +
        '<div class="field"><label>' + esc(span) + " · " + cols + " day" + (cols===1?"":"s") +
          ", " + S.habits.length + " habits</label>" +
          '<textarea id="c-text" class="colbox" rows="4" readonly>' + esc(buildBlock(days, withToday)) +
          "</textarea>" +
          '<div class="help">Habits are in the same order as your sheet, one line each.</div></div>' +

        '<button class="ghost" id="c-today" style="margin-top:0">' +
          (withToday ? "✓ Including today (still changeable)" : "+ Include today as well") + "</button>" +

        '<button class="primary" id="c-copy">' + (cols ? "Copy " + cols + " day" + (cols===1?"":"s") : "Nothing to copy") + "</button>" +

        '<div class="field" style="margin-top:22px"><label>Where it goes</label><div class="help">' +
          "1. Open the sheet.\n" +
          "2. Tap the first empty cell in the top date row.\n" +
          "3. Paste. The dates and every habit fill in together." +
        "</div></div>" +
        '<button class="ghost" id="c-close">Close</button>');

      document.getElementById("c-close").onclick = close;
      document.getElementById("c-today").onclick = function(){ withToday = !withToday; panel(); };

      var copyBtn = document.getElementById("c-copy");
      copyBtn.onclick = function(){
        if(!cols) return;
        var ta = document.getElementById("c-text"); ta.select();
        navigator.clipboard.writeText(ta.value).then(function(){
          copyBtn.textContent = "Copied — now paste it in";
          if(days.length){ S.exported = days[days.length-1]; save(); }
        }).catch(function(){
          copyBtn.textContent = "Select the text above and copy";
        });
      };
    }
    panel();
  };

  document.getElementById("dataBtn").onclick = function(){
    var onDevice = readLocal() ? "Saved on this device" : "NOT saving on this device";
    var onAccount = cloudOK === true ? "Synced to your Claude account"
                  : cloudOK === false ? "Not syncing to your account (that's fine)"
                  : "Account sync not checked yet";
    open('<h2>Backup</h2>'+
      '<div class="field"><label>Where your data is</label><div class="help">'+
        esc(onDevice)+"\n"+esc(onAccount)+"</div></div>"+
      '<div class="field"><label>Everything, as text</label>'+
        '<textarea id="b-text" rows="6" spellcheck="false">'+esc(JSON.stringify(S))+"</textarea>"+
        '<div class="help">Copy this into a note every couple of weeks. To restore, paste a backup '+
        'over the top and tap Restore.</div></div>'+
      '<button class="primary" id="b-copy">Copy to clipboard</button>'+
      '<button class="ghost" id="b-restore">Restore from the box</button>'+
      '<button class="ghost danger" id="b-fresh">Start again from zero</button>'+
      '<button class="ghost" id="b-cancel">Close</button>');
    document.getElementById("b-cancel").onclick = close;
    document.getElementById("b-copy").onclick = function(){
      var ta = document.getElementById("b-text"); ta.select();
      navigator.clipboard.writeText(ta.value).then(function(){
        document.getElementById("b-copy").textContent = "Copied";
      }).catch(function(){
        document.getElementById("b-copy").textContent = "Select the text and copy it";
      });
    };
    document.getElementById("b-fresh").onclick = function(){
      open('<h2>Start again?</h2><div class="field"><div class="help">' +
        "Keeps your habits and their names. Clears every score, every recorded day, and today's " +
        "logging, back to a blank slate.\n\nCopy your backup out first if you might want it.</div></div>" +
        '<button class="primary" id="r-yes">Yes, start again</button>' +
        '<button class="ghost" id="r-no">Cancel</button>');
      document.getElementById("r-no").onclick = close;
      document.getElementById("r-yes").onclick = function(){
        S.habits.forEach(function(h){ h.score = 0; h.frac = 0; h.expr = ""; });
        S.log = {}; S.history = []; S.scores = {};
        S.lastDay = dstr(new Date());
        S.lastAdded = addDays(S.lastDay, -1);
        S.exported = addDays(S.lastDay, -1);
        save(); close(); render();
      };
    };
    document.getElementById("b-restore").onclick = function(){
      try{
        var next = JSON.parse(document.getElementById("b-text").value);
        if(!next.habits) throw 0;
        S = next; rollover(); save(); close(); render();
      }catch(e){ document.getElementById("b-restore").textContent = "That isn't a valid backup"; }
    };
  };

  buildTicks(); boot();
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) flushNow();
    else if(S){ rollover(); render(); }
  });
})();
</script>
